[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "etl-pyspark-countries"
version = "0.1.0"
description = "Pipeline ETL com PySpark para dados JSON da API REST Countries"
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.4",
    "requests>=2.31",
    "pyyaml>=6.0",
    "findspark>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "black>=23.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
